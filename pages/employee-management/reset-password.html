<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đặt lại mật khẩu</title>
  <link rel="icon" type="image/png" href="../../assets/images/logo.png" />
  <link rel="stylesheet" href="../../assets/css/login.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css"
    rel="stylesheet"
  />
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-xl rounded-[32px] bg-white p-8 shadow-[0_35px_120px_-15px_rgba(15,23,42,0.2)]">
    <div class="flex flex-col items-center gap-4 text-center">
      <div class="flex h-20 w-20 items-center justify-center rounded-full bg-blue-100 text-blue-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 17a2 2 0 0 0 2-2v-3a2 2 0 0 0-4 0v3a2 2 0 0 0 2 2z" />
          <rect x="8" y="10" width="8" height="5" rx="2" />
          <path d="M5 11V9a7 7 0 0 1 14 0v2" />
          <path d="M8 17v3h8v-3" />
        </svg>
      </div>
      <div>
        <p class="text-3xl font-semibold text-slate-900">Đặt lại mật khẩu</p>
        <p class="mt-2 text-sm text-slate-500">Nhập mật khẩu mới để tiếp tục sử dụng hệ thống</p>
      </div>
    </div>

    <form id="reset-password" class="mt-10 space-y-6" novalidate>
      <div class="grid gap-6">
        <div>
          <label for="newPassword" class="mb-2 block text-sm font-medium text-slate-700">Mật khẩu mới</label>
          <div class="relative">
            <input
              id="newPassword"
              placeholder="Nhập mật khẩu mới"
              class="block w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
            />
            <button type="button" id="toggleNewPassword" class="absolute inset-y-0 right-3 flex items-center justify-center text-slate-500 hover:text-slate-900">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <div>
          <label for="confirmPassword" class="mb-2 block text-sm font-medium text-slate-700">Xác nhận mật khẩu</label>
          <div class="relative">
            <input
              id="confirmPassword"
              placeholder="Nhập lại mật khẩu mới"
              class="block w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
            />
            <button type="button" id="toggleConfirmPassword" class="absolute inset-y-0 right-3 flex items-center justify-center text-slate-500 hover:text-slate-900">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
           
          </div>
        </div>
        <div id="error">
           <span class="error-msg text-xs text-rose2 mt-1 block text-[red]"></span>
        </div> 
      </div>

      <div class="grid gap-4">
        <button type="submit" class="inline-flex w-full items-center justify-center rounded-2xl bg-blue-600 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-blue-500/20 transition hover:bg-blue-700">
          ĐẶT LẠI MẬT KHẨU
        </button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
  <script>
    const toggleField = (buttonId, inputId) => {
      const button = document.getElementById(buttonId);
      const input = document.getElementById(inputId);
      button?.addEventListener('click', () => {
        if (!input) return;
        input.type = input.type === 'password' ? 'text' : 'password';
      });
    };
    toggleField('toggleNewPassword', 'newPassword');
    toggleField('toggleConfirmPassword', 'confirmPassword');
  </script>
  <script type="module" src="../../assets/js/services/resetPassword.js"></script>
</body>
</html>
