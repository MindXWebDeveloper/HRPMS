<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý nhân viên</title>
    <link rel="icon" type="image/png" href="../../assets/images/logo.png" />

    <link
      href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      * {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body data-base-path="../../">
    <div data-layout="sidebar"></div>

    <div class="p-4 sm:ml-64 min-h-full">
      <div
        class="relative min-h-full overflow-x-auto bg-neutral-primary-soft shadow-xs rounded-base border border-default grid-rows-9 gap-4"
      >
        <div class="mx-8 my-2 font-bold text-xl row-span-2">Danh sách nhân viên</div>

        <div class="p-4 flex items-center justify-between space-x-4 row-span-2">
          <label for="employee-search-input" class="sr-only">Search</label>
          <div class="flex items-center gap-2">
            <div class="relative">
              <div
                class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none"
              >
                <svg
                  class="w-4 h-4 text-body"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-width="2"
                    d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"
                  />
                </svg>
              </div>
              <input
                type="text"
                id="employee-search-input"
                class="block w-full max-w-96 ps-9 pe-3 py-2 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
                placeholder="Tìm theo họ và tên"
              />
            </div>

            <button
              id="employee-search-btn"
              type="button"
              class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700"
            >
              Tìm kiếm
            </button>
          </div>

        </div>
        <div
          class="relative min-h-[70vh] overflow-x-auto bg-neutral-primary-soft shadow-xs rounded-base border border-default"
        >
          <table class="w-full text-sm text-left rtl:text-right text-body">
            <thead
              class="text-sm text-body bg-neutral-secondary-medium border-b border-default-medium"
            >
              <tr>
                <th scope="col" class="px-6 py-3">Mã nhân viên</th>
                <th scope="col" class="px-6 py-3">Họ và tên</th>
                <th scope="col" class="px-6 py-3">Phòng ban</th>
                <th scope="col" class="px-6 py-3">Chức vụ</th>
                <th scope="col" class="px-6 py-3">Trạng thái</th>
                <th scope="col" class="px-6 py-3">Thao tác</th>
              </tr>
            </thead>
            <tbody id="employeeTableBody">
              <tr
                class="bg-neutral-primary-soft border-b border-default hover:bg-neutral-secondary-medium"
              >
                <td
                  scope="row"
                  class="px-6 py-4 font-medium text-heading whitespace-nowrap"
                >
                  EMPBE001
                </td>
                <td class="px-6 py-4">Lương Văn Thanh</td>
                <td class="px-6 py-4">Backend</td>
                <td class="px-6 py-4">Developer</td>
                <td class="px-6 py-4">
                  <div class="flex items-center">
                    <div
                      class="h-2.5 w-2.5 rounded-full bg-green-500 me-2"
                    ></div>
                    Hoạt động
                  </div>
                </td>
                <td class="px-6 py-4">
                  <div class="flex">
                    <div class="relative group">
                      <a href="../accountedit/AccountEdit.html" class="text-blue-500">
                        <svg
                          class="w-6 h-6 text-gray-800 dark:text-white"
                          aria-hidden="true"
                          xmlns="http://www.w3.org/2000/svg"
                          width="24"
                          height="24"
                          fill="none"
                          viewBox="0 0 24 24"
                        >
                          <path
                            stroke="currentColor"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="m14.304 4.844 2.852 2.852M7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-4.5m2.409-9.91a2.017 2.017 0 0 1 0 2.853l-6.844 6.844L8 14l.713-3.565 6.844-6.844a2.015 2.015 0 0 1 2.852 0Z"
                          />
                        </svg>
                      </a>

                      <div
                        class="absolute left-1/2 -translate-x-1/2 mt-2 hidden group-hover:block rounded bg-gray-800 px-2 py-1 text-sm text-white whitespace-nowrap"
                      >
                        Edit
                      </div>
                    </div>

                    <div class="relative group">
                      <a href="../accountedit/AccountEdit.html" class="text-blue-500">
                        <svg
                          class="w-6 h-6 text-gray-800 dark:text-white"
                          aria-hidden="true"
                          xmlns="http://www.w3.org/2000/svg"
                          width="24"
                          height="24"
                          fill="none"
                          viewBox="0 0 24 24"
                        >
                          <path
                            stroke="currentColor"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M15 9h3m-3 3h3m-3 3h3m-6 1c-.306-.613-.933-1-1.618-1H7.618c-.685 0-1.312.387-1.618 1M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm7 5a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"
                          />
                        </svg>
                      </a>

                      <div
                        class="absolute left-1/2 -translate-x-1/2 mt-2 hidden group-hover:block rounded bg-gray-800 px-2 py-1 text-sm text-white whitespace-nowrap"
                      >
                        View
                      </div>
                    </div>
                  </div>
                </td>
              </tr>
              <tr
                class="bg-neutral-primary-soft border-b border-default hover:bg-neutral-secondary-medium"
              >
                <td
                  scope="row"
                  class="px-6 py-4 font-medium text-heading whitespace-nowrap"
                >
                  EMPIT001
                </td>
                <td class="px-6 py-4">Nguyễn Hữu Linh</td>
                <td class="px-6 py-4">IT</td>
                <td class="px-6 py-4">IT Support</td>
                <td class="px-6 py-4">
                  <div class="flex items-center">
                    <div class="h-2.5 w-2.5 rounded-full bg-red-500 me-2"></div>
                    Ngưng hoạt động
                  </div>
                </td>
                <td class="px-6 py-4">
                  <div class="flex">
                    <div class="relative group">
                      <a href="../accountedit/AccountEdit.html" class="text-blue-500">
                        <svg
                          class="w-6 h-6 text-gray-800 dark:text-white"
                          aria-hidden="true"
                          xmlns="http://www.w3.org/2000/svg"
                          width="24"
                          height="24"
                          fill="none"
                          viewBox="0 0 24 24"
                        >
                          <path
                            stroke="currentColor"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="m14.304 4.844 2.852 2.852M7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-4.5m2.409-9.91a2.017 2.017 0 0 1 0 2.853l-6.844 6.844L8 14l.713-3.565 6.844-6.844a2.015 2.015 0 0 1 2.852 0Z"
                          />
                        </svg>
                      </a>

                      <div
                        class="absolute left-1/2 -translate-x-1/2 mt-2 hidden group-hover:block rounded bg-gray-800 px-2 py-1 text-sm text-white whitespace-nowrap"
                      >
                        Edit
                      </div>
                    </div>

                    <div class="relative group">
                      <a href="../accountedit/AccountEdit.html" class="text-blue-500">
                        <svg
                          class="w-6 h-6 text-gray-800 dark:text-white"
                          aria-hidden="true"
                          xmlns="http://www.w3.org/2000/svg"
                          width="24"
                          height="24"
                          fill="none"
                          viewBox="0 0 24 24"
                        >
                          <path
                            stroke="currentColor"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M15 9h3m-3 3h3m-3 3h3m-6 1c-.306-.613-.933-1-1.618-1H7.618c-.685 0-1.312.387-1.618 1M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm7 5a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"
                          />
                        </svg>
                      </a>

                      <div
                        class="absolute left-1/2 -translate-x-1/2 mt-2 hidden group-hover:block rounded bg-gray-800 px-2 py-1 text-sm text-white whitespace-nowrap"
                      >
                        View
                      </div>
                    </div>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>

        </div>
        <nav
          class="flex items-center flex-column flex-wrap md:flex-row justify-between p-4"
          aria-label="Table navigation"
        >
          <span
            id="employee-pagination-summary"
            class="text-sm font-normal text-body mb-4 md:mb-0 block w-full md:inline md:w-auto"
            >Hiển thị 0-0 of 0</span
          >
          <ul id="employee-pagination-controls" class="flex -space-x-px text-sm"></ul>
        </nav>
      </div>
    </div>
      <script type="module" src="../../assets/js/layout.js"></script>
      <script type="module" src="../../assets/js/employee-management.js"></script>
  </body>
</html>
