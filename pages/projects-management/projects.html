<!doctype html>
<html lang="en">
  <>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý dự án</title>
    <link rel="icon" type="image/png" href="../../assets/images/logo.png" />

    <link
      href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body data-base-path="../../">
    <div data-layout="sidebar"></div>

    <div class="p-4 sm:ml-64 min-h-full">
      <div
        class="relative min-h-full overflow-x-auto bg-neutral-primary-soft shadow-xs rounded-base border border-default grid-rows-9 gap-4"
      >
        <div class="mx-8 my-2 font-bold text-xl row-span-2">Danh sách dự án</div>

        <div class="p-4 flex items-center justify-between space-x-4 row-span-2">
          <label for="input-group-1" class="sr-only">Search</label>
          <div class="flex items-center gap-2">
            <div class="relative">
              <div
                class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none"
              >
                <svg
                  class="w-4 h-4 text-body"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-width="2"
                    d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"
                  />
                </svg>
              </div>
              <input
                type="text"
                id="input-group-1"
                class="block w-full max-w-96 ps-9 pe-3 py-2 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
                placeholder="Search"
              />
            </div>
            <button
              id="project-search-btn"
              type="button"
              class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700"            >
              Tìm kiếm
            </button>
          </div>

          <!-- Thêm tài khoản -->
          <button
            data-modal-target="add-project"
            data-modal-toggle="add-project"
            class="flex items-center text-white bg-blue-500 rounded-md text-[14px] sm:text-sm text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none"
            type="button"
          >
            <svg
              class="w-4 h-4 me-1.5 -ms-0.5"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 12h14m-7 7V5"
              />
            </svg>
            Thêm dự án
          </button>

          <!-- Main modal -->
          <div
            id="add-project"
            tabindex="-1"
            aria-hidden="true"
            class="hidden overflow-y-auto overflow-x-hidden fixed inset-0 z-50 justify-center items-center w-full h-full bg-black/50 backdrop-blur-sm"
          >
            <div
              class="relative p-4 w-full max-w-md max-h-full bg-white rounded-base shadow-sm"
            >
              <!-- Modal content -->
              <div
                class="relative bg-neutral-primary-soft border border-default rounded-base shadow-sm p-4 md:p-6"
              >
                <!-- Modal header -->
                <div
                  class="flex items-center justify-between border-b border-default pb-4 md:pb-5"
                >
                  <h3 class="text-lg font-medium text-heading">
                    Thêm dự án
                  </h3>
                  <button
                    type="button"
                    class="text-body bg-transparent hover:bg-neutral-tertiary hover:text-heading rounded-base text-sm w-9 h-9 ms-auto inline-flex justify-center items-center"
                    data-modal-hide="add-project"
                  >
                    <svg
                      class="w-5 h-5"
                      aria-hidden="true"
                      xmlns="http://www.w3.org/2000/svg"
                      width="24"
                      height="24"
                      fill="none"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke="currentColor"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M6 18 17.94 6M18 18 6.06 6"
                      />
                    </svg>
                    <span class="sr-only">Close modal</span>
                  </button>
                </div>
                <!-- Modal body -->
                <form id="project-form" action="#">
                  <div class="grid gap-4 grid-cols-1 py-4 md:py-6">
                    <div>
                      <label
                        for="projectName"
                        class="block mb-2.5 text-sm font-medium text-heading"
                        >Tên dự án</label
                      >
                      <input
                        type="text"
                        name="projectName"
                        id="projectName"
                        class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
                        placeholder="Tên dự án"
                        required
                      />
                    </div>
                    <div class="relative">
                      <label
                        for="leadName"
                        class="block mb-2.5 text-sm font-medium text-heading"
                        >Tên quản lý</label
                      >
                      <input
                        type="text"
                        id="leadName"
                        class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
                        placeholder="Tên quản lý"
                        required
                      />
                      <input id="leadCode" type="hidden" />
                      <div
                        id="lead-name-suggest-list"
                        class="absolute z-10 mt-1 hidden max-h-56 w-full overflow-auto rounded-lg border bg-white shadow"
                      ></div>
                    </div>
                    <div>
                      <label
                        for="memberCount"
                        class="block mb-2.5 text-sm font-medium text-heading"
                        >Số thành viên</label
                      >
                      <input
                        type="number"
                        min="1"
                        step="1"
                        id="memberCount"
                        class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
                        placeholder="Số thành viên"
                        required
                      />
                    </div>
                    <div>
                      <label
                        for="projectStatus"
                        class="block mb-2.5 text-sm font-medium text-heading"
                        >Trạng thái</label
                      >
                      <select
                        id="projectStatus"
                        class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs"
                        required
                      >
                        <option value="">Chọn trạng thái</option>
                        <option value="Đang tiến hành">Đang tiến hành</option>
                        <option value="Tạm dừng">Tạm dừng</option>
                        <option value="Hoàn thành">Hoàn thành</option>
                      </select>
                    </div>
                  </div>
                  <div
                    class="flex items-center space-x-4 border-t border-default pt-4 md:pt-6"
                  >
                    <button
                      type="submit"
                      class="inline-flex items-center text-white bg-blue-500 hover:bg-brand-strong box-border border border-transparent focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none"
                    >
                      <svg
                        class="w-4 h-4 me-1.5 -ms-0.5"
                        aria-hidden="true"
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        fill="none"
                        viewBox="0 0 24 24"
                      >
                        <path
                          stroke="currentColor"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M5 12h14m-7 7V5"
                        />
                      </svg>
                      Thêm
                    </button>
                    <button
                      data-modal-hide="add-project"
                      type="button"
                      class="text-body bg-neutral-secondary-medium box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading focus:ring-4 focus:ring-neutral-tertiary shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none"
                    >
                      Cancel
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
        <div
          class="relative min-h-[70vh] overflow-x-auto bg-neutral-primary-soft shadow-xs rounded-base border border-default"
        >
          <table class="w-full text-sm text-left rtl:text-right text-body">
            <thead
              class="text-sm text-body bg-neutral-secondary-medium border-b border-default-medium"
            >
              <tr>
                <th scope="col" class="px-6 py-3">Mã dự án</th>
                <th scope="col" class="px-6 py-3">Tên dự án</th>
                <th scope="col" class="px-6 py-3">Quản lý</th>
                <th scope="col" class="px-6 py-3">Thành viên</th>
                <th scope="col" class="px-6 py-3">Tiến độ</th>
                <th scope="col" class="px-6 py-3">Trạng thái</th>
                <th scope="col" class="px-6 py-3">Thao tác</th>
              </tr>
            </thead>
            <tbody id="project-table-body">
            </tbody>
          </table>

        </div>
                  <nav
            class="flex items-center flex-column flex-wrap md:flex-row justify-between p-4"
            aria-label="Table navigation"
          >
            <span
              id="project-pagination-summary"
              class="text-sm font-normal text-body mb-4 md:mb-0 block w-full md:inline md:w-auto"
              >Hiển thị 0-0 of 0</span
            >
            <ul id="project-pagination-controls" class="flex -space-x-px text-sm"></ul>
          </nav>
      </div>
    </div>
      <script type="module" src="../../assets/js/layout.js"></script>
      <script type="module" src="../../assets/js/projectLayout.js"></script>
  </body>
</html>
