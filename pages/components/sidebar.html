<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sidebar</title>
  </head>
  <body>
    <template id="sidebar-template">
      <button
        data-drawer-target="separator-sidebar"
        data-drawer-toggle="separator-sidebar"
        aria-controls="separator-sidebar"
        type="button"
        class="fixed left-3 top-3 z-50 inline-flex rounded-base border border-transparent bg-white p-2 text-[#01133F] shadow-sm hover:bg-gray-100 focus:outline-none focus:ring-4 focus:ring-blue-200 xl:hidden"
      >
        <span class="sr-only">Open sidebar</span>
        <svg
          class="h-6 w-6"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="none"
          viewBox="0 0 24 24"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-width="2"
            d="M5 7h14M5 12h14M5 17h10"
          />
        </svg>
      </button>

      <aside
        id="separator-sidebar"
        class="fixed left-0 top-0 z-40 h-screen w-64 -translate-x-full bg-[#01133F] text-white transition-transform xl:translate-x-0"
        aria-label="Sidebar"
      >
        <nav class="flex h-full flex-col overflow-y-auto px-3 py-4">
          <a
            data-href="pages/accountdashboard/accountdashboard.html"
            class="mb-5 flex items-center gap-3 px-2.5 text-white"
          >
            <img
              data-src="assets/images/logo-nav.png"
              class="h-9 w-9 shrink-0 bg-white object-contain p-1"
              alt="HRPMS Logo"
            />
            <span class="text-lg font-semibold whitespace-nowrap">HRPMS</span>
          </a>

          <ul class="space-y-2 font-medium">
            <li data-role="all">
              <a
                data-href="pages/accountdashboard/accountdashboard.html"
                data-nav-id="dashboard"
                class="flex w-full items-center gap-3 rounded-base px-2 py-2 text-white hover:bg-[#0F4EA0]"
              >
                <svg
                  class="h-5 w-5 shrink-0"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M10 6.025A7.5 7.5 0 1 0 17.975 14H10V6.025Z"
                  />
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M13.5 3c-.169 0-.334.014-.5.025V11h7.975c.011-.166.025-.331.025-.5A7.5 7.5 0 0 0 13.5 3Z"
                  />
                </svg>
                <span class="min-w-0 flex-1 whitespace-nowrap">Dashboard</span>
              </a>
            </li>

            <li data-role="admin">
              <button
                type="button"
                class="flex w-full items-center gap-3 rounded-base px-2 py-2 text-white hover:bg-[#0F4EA0]"
                aria-controls="dropdown-employee-management"
                data-collapse-toggle="dropdown-employee-management"
              >
                <svg
                  class="h-5 w-5 shrink-0"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-width="2"
                    d="M4.5 17H4a1 1 0 0 1-1-1 3 3 0 0 1 3-3h1m0-3.05A2.5 2.5 0 1 1 9 5.5M19.5 17h.5a1 1 0 0 0 1-1 3 3 0 0 0-3-3h-1m0-3.05a2.5 2.5 0 1 0-2-4.45m.5 13.5h-7a1 1 0 0 1-1-1 3 3 0 0 1 3-3h3a3 3 0 0 1 3 3 1 1 0 0 1-1 1Zm-1-9.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Z"
                  />
                </svg>
                <span class="min-w-0 flex-1 text-left whitespace-nowrap">
                  Quản lý nhân viên
                </span>
                <svg
                  class="h-5 w-5 shrink-0"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="m19 9-7 7-7-7"
                  />
                </svg>
              </button>

              <ul
                id="dropdown-employee-management"
                class="hidden py-2 space-y-2"
              >
                <li>
                  <a
                    data-href="pages/employee-management/account-management.html"
                    data-nav-id="admin"
                    class="flex items-center rounded-base px-2 py-2 pl-10 text-white hover:bg-[#0F4EA0]"
                  >
                    Quản lý tài khoản
                  </a>
                </li>
                <li>
                  <a
                    data-href="pages/employee-management/employees.html"
                    data-nav-id="employees"
                    class="flex items-center rounded-base px-2 py-2 pl-10 text-white hover:bg-[#0F4EA0]"
                  >
                    Hồ sơ nhân viên
                  </a>
                </li>
                <li>
                  <a
                    href="#"
                    class="flex items-center rounded-base px-2 py-2 pl-10 text-white hover:bg-[#0F4EA0]"
                  >
                    Quản lý chấm công
                  </a>
                </li>
                <li>
                  <a
                    href="#"
                    class="flex items-center rounded-base px-2 py-2 pl-10 text-white hover:bg-[#0F4EA0]"
                  >
                    Quản lý lương thưởng
                  </a>
                </li>
              </ul>
            </li>

            <li data-role="all">
               <a
                    data-href="pages/projects-management/projects.html"
                    data-nav-id="projects"
                    class="flex w-full items-center gap-3 rounded-base px-2 py-2 text-white hover:bg-[#0F4EA0]"
                  >
                   <svg
                  class="h-5 w-5 shrink-0"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    d="M6 2c-1.10457 0-2 .89543-2 2v4c0 .55228.44772 1 1 1s1-.44772 1-1V4h12v7h-2c-.5523 0-1 .4477-1 1v2h-1c-.5523 0-1 .4477-1 1s.4477 1 1 1h5c.5523 0 1-.4477 1-1V3.85714C20 2.98529 19.3667 2 18.268 2H6Z"
                  />
                  <path
                    d="M6 11.5C6 9.567 7.567 8 9.5 8S13 9.567 13 11.5 11.433 15 9.5 15 6 13.433 6 11.5ZM4 20c0-2.2091 1.79086-4 4-4h3c2.2091 0 4 1.7909 4 4 0 1.1046-.8954 2-2 2H6c-1.10457 0-2-.8954-2-2Z"
                  />
                </svg>
                    Quản lý dự án
                  </a>
            </li>

            <li data-role="admin">
              <button
                type="button"
                class="flex w-full items-center gap-3 rounded-base px-2 py-2 text-white hover:bg-[#0F4EA0]"
                aria-controls="dropdown-education-management"
                data-collapse-toggle="dropdown-education-management"
              >
                <svg
                  class="h-5 w-5 shrink-0"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M5 4h1.5L9 16m0 0h8m-8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm-8.5-3h9.25L19 7H7.312"
                  />
                </svg>
                <span class="min-w-0 flex-1 text-left whitespace-nowrap">
                  Quản lý đào tạo
                </span>
                <svg
                  class="h-5 w-5 shrink-0"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="m19 9-7 7-7-7"
                  />
                </svg>
              </button>

              <ul
                id="dropdown-education-management"
                class="hidden py-2 space-y-2"
              >
                <li>
                  <a
                    href="#"
                    class="flex items-center rounded-base px-2 py-2 pl-10 text-white hover:bg-[#0F4EA0]"
                  >
                    Tạo khóa học
                  </a>
                </li>
                <li>
                  <a
                    href="#"
                    class="flex items-center rounded-base px-2 py-2 pl-10 text-white hover:bg-[#0F4EA0]"
                  >
                    Danh sách khóa học
                  </a>
                </li>
                <li>
                  <a
                    href="#"
                    class="flex items-center rounded-base px-2 py-2 pl-10 text-white hover:bg-[#0F4EA0]"
                  >
                    Báo cáo
                  </a>
                </li>
              </ul>
            </li>
          </ul>

          <ul
            class="mt-auto space-y-2 border-t border-white/20 pt-4 font-medium"
          >
            <li data-role="all" id="fullName" class="flex w-full items-center gap-3 rounded-base px-2 py-2 text-white hover:bg-[#0F4EA0] capitalize">Lương Văn Thanh</li>
            <a data-href="pages/accountedit/accountview.html">
              <li data-role="all" class="flex w-full items-center gap-3 rounded-base px-2 py-2 text-white hover:bg-[#0F4EA0]">Hồ sơ của tôi</li>
            </a>
            <a data-href="pages/employee-management/reset-password.html">
              <li data-role="all" class="flex w-full items-center gap-3 rounded-base px-2 py-2 text-white hover:bg-[#0F4EA0]">Đặt lại mật khẩu</li>
            </a>
            <li data-role="all">
              <button
                id="btnLogout"
                class="flex w-full items-center gap-3 rounded-base px-2 py-2 text-white hover:bg-[#0F4EA0]"
              >
                <svg
                  class="h-5 w-5 shrink-0"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M16 12H4m12 0-4 4m4-4-4-4m3-4h2a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-2"
                  />
                </svg>
                Đăng xuất
              </button>
            </li>
          </ul>
        </nav>
      </aside>
    </template>
  </body>
</html>
