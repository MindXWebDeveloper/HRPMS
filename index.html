<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập</title>
    <link rel="icon" type="image/png" href="./assets/images/logo.png" />
    <link rel="stylesheet" href="./assets/css/login.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="./assets/js/sigin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>

  <body class="auth-page flex min-h-screen items-center justify-center p-4">
    <div
      class="auth-card flex w-full max-w-[560px] flex-col justify-center rounded-3xl bg-white px-10 py-12 shadow-lg lg:px-12"
    >
      <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <img
          src="./assets/images/logo.png"
          alt="Your Company"
          class="mx-auto h-44 w-auto"
        />
        <h2
          class="mt-10 text-center text-2xl/9 font-bold tracking-tight text-gray-500"
        >
          Đăng nhập
        </h2>
      </div>

      <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-md">
        <form class="space-y-6" id="login-form">
          <div>
            <label
              for="account"
              class="block text-sm/6 font-medium"
              >Tài khoản</label
            >
            <div class="mt-2 input">
              <input
                id="account"
                type="text"
                name="account"
                class="block w-full rounded-md border border-slate-300 bg-white/5 px-3 py-1.5 text-base outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
              />
              <span class="error-msg text-xs text-rose2 mt-1 block text-[red]"></span>
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between">
              <label
                for="password"
                class="block text-sm/6 font-medium text-gray-500"
                >Mật khẩu</label
              >
              <div class="text-sm">
                <a
                  href="#"
                  class="font-semibold text-indigo-400 hover:text-indigo-300"
                  >Quên mật khẩu?</a
                >
              </div>
            </div>
            <div class="mt-2 input">
              <input
                id="password"
                type="password"
                name="password"
                required
                autocomplete="current-password"
                class="block w-full rounded-md border border-slate-300 bg-white/5 px-3 py-1.5 text-base outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6"
              />
              <span class="error-msg text-xs text-rose2 mt-1 block"></span>
            </div>
          </div>

          <div>
              <button
                type="submit"
                class="flex w-full justify-center rounded-md bg-indigo-500 px-3 py-1.5 text-sm/6 font-semibold text-white hover:bg-indigo-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500"
                >
                Đăng nhập
              </button>
          </div>
        </form>
      </div>
    </div>
    <script type="module" src="./assets/js/sigin.js"></script>
  </body>
</html>
